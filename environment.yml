# Reproducible local (CPU-only, macOS/Linux) environment for TabFM.
#
# Verified on: macOS arm64, Python 3.11, JAX backend, CPU only (no GPU on
# this machine). Confirms env build + tiny-model fit/predict pipeline runs
# end-to-end (see tabfm/src/classifier_and_regressor_test.py, run via
# `PYTHONPATH=. python3 -m unittest tabfm.src.classifier_and_regressor_test`).
#
# Create with:
#   conda env create -f environment.yml
#   conda activate tabfm
#
# *** IMPORTANT for KSC (GPU cluster) submission ***
# This file installs the CPU-only JAX/jaxlib build (the default PyPI
# `jax`/`jaxlib` wheels have no CUDA support). Before submitting a real
# training job on KSC:
#   1. Replace the `jax`/`jaxlib` pip lines below with the CUDA12 plugin, e.g.:
#        pip install -U "jax[cuda12]"
#      (this matches the `cuda` extra already defined in tabfm/pyproject.toml:
#       `pip install -e .[jax,cuda]`).
#   2. Make sure the CUDA/cuDNN versions available on the KSC compute node
#      match what the jax[cuda12] wheel expects (check `jax.print_environment_info()`).
#   3. If using the PyTorch backend instead (`pip install -e .[pytorch]`),
#      swap `torch` for a CUDA build matching the cluster's CUDA version,
#      e.g. `pip install torch --index-url https://download.pytorch.org/whl/cu121`
#      (this repo's requirements.txt pins `torch==2.12.1+cpu` from the CPU
#      wheel index, which is unrelated to GPU capability -- for GPU on KSC use
#      the correct `cuXXX` wheel index for that node's CUDA version instead).
#   4. Re-run `python -c "import jax; print(jax.devices())"` (or the torch
#      equivalent `torch.cuda.is_available()`) on the KSC node to confirm the
#      accelerator is visible before launching the real job.
name: tabfm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - absl-py==2.5.0
      - aiofiles==25.1.0
      - anyio==4.14.2
      - argon2-cffi==25.1.0
      - argon2-cffi-bindings==25.1.0
      - certifi==2026.7.22
      - cffi==2.1.1
      - charset-normalizer==3.4.9
      - chex==0.1.92
      - click==8.4.2
      - einops==0.8.2
      - etils==1.14.0
      - filelock==3.32.2
      - flax==0.12.8
      - fsspec==2026.7.0
      - h11==0.16.0
      - hf-xet==1.6.0
      - httpcore==1.0.9
      - httpx==0.28.1
      - huggingface_hub==1.27.0
      - humanize==4.16.0
      - idna==3.18
      - jax==0.10.2
      - jaxlib==0.10.2
