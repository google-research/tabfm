      - pycparser==3.0
      - pycryptodome==3.23.0
      - Pygments==2.20.0
      - python-dateutil==2.9.0.post0
      - PyYAML==6.0.3
      - requests==2.34.2
      - rich==15.0.0
      - scikit-learn==1.9.0
      - scipy==1.17.1
      - simplejson==4.1.1
